[global]
error_log = /proc/self/fd/2
log_limit = 8192

[www]
; Processus PHP : à ajuster selon la mémoire du serveur (~60 Mo par processus).
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; Contrôle de santé (utilisé par php-fpm-healthcheck, non exposé par Nginx).
ping.path = /fpm-ping
ping.response = pong

catch_workers_output = yes
decorate_workers_output = no
request_terminate_timeout = 180s
