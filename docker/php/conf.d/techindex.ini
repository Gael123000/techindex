; Réglages PHP communs (développement et production).
expose_php = Off
memory_limit = 256M
max_execution_time = 120
max_input_time = 120
max_input_vars = 5000
; Pièces jointes (20 Mo par défaut côté application) et imports.
upload_max_filesize = 25M
post_max_size = 26M
date.timezone = UTC
default_charset = "UTF-8"
log_errors = On
error_log = /proc/self/fd/2
; Les sessions sont gérées par Laravel (base de données) ; valeurs sûres par défaut.
session.use_strict_mode = 1
session.cookie_httponly = 1
