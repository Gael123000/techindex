# Configuration commune aux serveurs HTTP et HTTPS de TechIndex.
root /var/www/html/public;
index index.php;
charset utf-8;
server_tokens off;

# Pièces jointes (20 Mo côté application) et imports.
client_max_body_size 26m;

# Contrôle de santé du serveur web (sans appel à PHP).
location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Ressources compilées par Vite : noms de fichiers versionnés, cache long.
location /build/ {
    access_log off;
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /favicon.svg { access_log off; log_not_found off; }
location = /robots.txt { access_log off; log_not_found off; }

# Fichiers cachés (.env, .git...) : jamais servis.
location ~ /\.(?!well-known/acme-challenge) {
    deny all;
    return 404;
}

# Toutes les requêtes applicatives passent par le contrôleur frontal.
location / {
    try_files $uri /index.php$is_args$args;
}

location = /index.php {
    include fastcgi_params;
    fastcgi_pass php_fpm;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    # Protection "httpoxy".
    fastcgi_param HTTP_PROXY "";
    fastcgi_read_timeout 180s;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;
}

# Aucun autre script PHP n'est exécutable.
location ~ \.php$ {
    return 404;
}
